name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the Supabase trigger when a listing is published/changed
  # (docs/listing-rebuild-webhook.md) — new listings get their prerendered
  # page, sitemap entry and IndexNow ping within minutes.
  repository_dispatch:
    types: [listings-changed]
  schedule:
    # Monthly rebuild on the 5th, 06:10 UTC: picks up the fresh BFS fuel
    # prices (published at the start of the month) and re-prerenders the
    # listing pages from the live database.
    - cron: "10 6 5 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: supabase-js needs native WebSocket during prerendering
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the deploy on a type error instead of shipping a broken island.
      # `npm run build` runs this too; as a separate step it is the first
      # thing red in the log, before any data fetching noise.
      - name: Type-check
        run: npm run typecheck

      # Refresh the BFS national average fuel prices (monthly open data)
      # before building. Non-fatal: if the BFS API is unreachable, the
      # committed src/data/fuelPrices.json is the fallback.
      - name: Fetch fuel prices (BFS)
        run: npm run fetch:fuel
        continue-on-error: true

      # Regenerate the sitemap from the live database so every prerendered
      # /inserat/[slug] page is listed. Non-fatal: the committed sitemap.xml
      # is the fallback.
      - name: Generate sitemap (live listings)
        env:
          SITE_URL: https://testosteronny.github.io/EV4U
          PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run sitemap
        continue-on-error: true

      # Astro prerenders every page (incl. /inserat/[slug] from the live
      # database) and emits 404.html from 404.astro — the client fallback
      # that serves listings created after this build.
      - name: Build
        env:
          ASTRO_BASE: /EV4U
          PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing & friends (and thus ChatGPT search) about every URL right
      # after each deploy — the fast lane for new listings into LLM answers.
      - uses: actions/checkout@v4
      - name: Submit URLs to IndexNow
        env:
          SITE_URL: https://testosteronny.github.io/EV4U
        run: node scripts/submit-indexnow.mjs
        continue-on-error: true
